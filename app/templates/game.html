<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Songfy</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
<div id="embed-iframe"></div>
<div id="gameContainer" class="game-container">
    <main id="gameplayContainer" class="gameplay-container">
    <div id="gameLoader" class="game-loader" role="status" aria-live="polite">
        <span class="loader-spinner" aria-hidden="true"></span>
        <span>Loading songs…</span>
    </div>
    <div id="gameContent" class="game-content" hidden>
    <h1 id="roundHeader" class="round-header"></h1>
    <p id="resultMessage" class="result-message" role="status" aria-live="polite" hidden></p>
    <div id="buttonContainer" class="button-container">
        <button id="playBtn" class="primary-button main-button" disabled>Play</button>
        <button id="nextBtn" class="secondary-button next-button" disabled>Reveal answer</button>
    </div>
    <div id="infoContainer" hidden>
        <div>
            <label class="custom-checkbox">
                <input type="checkbox" id="songNameCheckbox"/>
                <span class="checkbox-label-text checkmark">Song name <span id="songNamePointsLabel"></span>: <span id="nameSpan"></span></span>
            </label>
        </div>
        <div>
            <label class="custom-checkbox">
                <input type="checkbox" id="artistsCheckbox"/>
                <span class="checkbox-label-text checkmark">Artist <span id="artistPointsLabel"></span>: <span id="artistsSpan"></span></span>
            </label>
        </div>
        <div>
            <label class="custom-checkbox">
                <input type="checkbox" id="releaseDateCheckbox"/>
                <span class="checkbox-label-text checkmark">Release year <span id="releaseYearPointsLabel"></span>: <span id="releaseSpan"></span></span>
            </label>
        </div>
        <button class="primary-button" id="confirmButton" disabled>Award points</button>
    </div>
    <div class="players-container" aria-label="Scoreboard"></div>
    </div>
    </main>
    <section id="endGameContainer" class="end-game-container" hidden>
        <p class="end-game-eyebrow">Game complete</p>
        <h1>Final rankings</h1>
        <p class="end-game-summary">Great game! Here’s how everyone finished.</p>
        <ol id="rankingsList" class="rankings-list"></ol>
        <a class="primary-button play-again-button" href="/songfy/">Play again</a>
    </section>
</div>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script src="../static/scripts.js"></script>
</body>
</html>
