<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Songfy — Rooms</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body class="index-container">
<main class="setup-page room-home">
    <h1 class="title">SONGFY</h1>
    <section class="setup-panel room-choice">
        <h2>Create a room</h2>
        <p>Start and control a game from this browser. Share the room code with spectators.</p>
        {% if spotify_authenticated %}
        <button id="create-room-btn" class="primary-button" type="button">Create room</button>
        {% else %}
        <a class="primary-button" href="/songfy/login?next=/songfy/">Sign in with Spotify to create</a>
        {% endif %}
        <p id="create-room-error" class="validation-message" hidden></p>
    </section>
    <form id="join-room-form" class="setup-panel room-choice">
        <h2>Join a room</h2>
        <p>Enter the six-character code shared by the host.</p>
        <label for="room-code-input">Room code</label>
        <input id="room-code-input" name="code" maxlength="6" autocomplete="off" required>
        <button class="secondary-button" type="submit">Join room</button>
    </form>
</main>
<script src="../static/index.js"></script>
</body>
</html>
